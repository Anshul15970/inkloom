<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inkloom AI Brand Governance</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="panel-container">
    <header class="panel-header">
      <div class="brand-badge">INKLOOM</div>
      <h1 class="panel-title">Brand Governance</h1>
      <p class="panel-subtitle">Real-time Pre-Publication Audit</p>
    </header>

    <main class="panel-body">
      <section class="section">
        <label for="brandSelect" class="label">Active Brand Workspace</label>
        <select id="brandSelect" class="select-input">
          <option value="">Select Brand Workspace...</option>
        </select>
      </section>

      <section class="section">
        <label for="channelSelect" class="label">Target Channel</label>
        <select id="channelSelect" class="select-input">
          <option value="linkedin">LinkedIn</option>
          <option value="twitter">X / Twitter</option>
          <option value="wordpress">Blog / Website</option>
          <option value="general">General Marketing</option>
        </select>
      </section>

      <section class="section">
        <div class="draft-header">
          <label for="draftText" class="label">Draft Content</label>
          <button id="extractBtn" class="btn-secondary" title="Extract text from active page editor">
            ⚡ Grab from Page
          </button>
        </div>
        <textarea id="draftText" class="textarea-input" rows="6" placeholder="Paste draft copy or grab from active web editor..."></textarea>
      </section>

      <button id="auditBtn" class="btn-primary">
        Run AI Governance Audit
      </button>

      <section id="resultsSection" class="section results-container hidden">
        <div class="score-card">
          <div class="score-circle">
            <span id="scoreValue">--</span>
          </div>
          <div>
            <div id="auditStatus" class="audit-status">READY</div>
            <div id="auditSummary" class="audit-summary">Awaiting analysis...</div>
          </div>
        </div>

        <div id="findingsContainer" class="findings-list">
          <!-- Findings populated dynamically -->
        </div>

        <button id="escalateBtn" class="btn-escalate hidden">
          Escalate to Brand Reviewer
        </button>
      </section>
    </main>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
